[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
vsesvit-core = { path = "crates/vsesvit-core" }
vsesvit-webext = { path = "crates/vsesvit-webext" }
vsesvit-gtk = { path = "crates/vsesvit-gtk" }
vsesvit-winui = { path = "crates/vsesvit-winui" }
vsesvit-update = { path = "crates/vsesvit-update" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = { version = "2.5", features = ["serde"] }
log = "0.4"

gtk = { package = "gtk4", version = "0.11", features = ["v4_22"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_9"] }
webkit = { package = "webkit6", version = "0.6", features = ["v2_52"] }
javascriptcore = { package = "javascriptcore6", version = "0.6" }

windows-core = "0.100"
windows-future = "0.100"
windows-collections = "0.100"
windows-link = "0.100"
windows-reference = "0.100"
windows-bindgen = "0.100"

# Tauri-format signing keys are scrypt-encrypted; unoptimized scrypt makes key tests take seconds.
[profile.dev.package.scrypt]
opt-level = 3
