# A sync server with Postgres. For SQLite instead, drop the postgres service and DATABASE_URL:
# the image then keeps its database in the vsesvit-sync volume. The server listens on 127.0.0.1
# only, for a reverse proxy in front of it (nginx.conf).
#
#   OIDC_ISSUER=<your provider's issuer> OIDC_CLIENT_ID=<your client id> \
#     POSTGRES_PASSWORD=$(openssl rand -hex 24) docker compose -f server/compose.yaml up -d --build
#
# Keep the password (in a .env file next to this one, say): the database keeps the first one.
services:
  vsesvit-sync:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: ghcr.io/mrquantumoff/vsesvit-sync-server:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: postgres://vsesvit:${POSTGRES_PASSWORD}@postgres/vsesvit
      OIDC_ISSUER: ${OIDC_ISSUER:?set OIDC_ISSUER to your OpenID Connect provider's issuer URL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID to the client id registered with the provider}
    volumes:
      - vsesvit-sync:/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: vsesvit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD to a generated password}
      POSTGRES_DB: vsesvit
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "vsesvit"]
      interval: 5s
      retries: 10

volumes:
  vsesvit-sync:
  postgres:
