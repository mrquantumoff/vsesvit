# nginx in front of the sync server: TLS, a request size limit that matches the server's, and a
# per-address rate limit. Copy to /etc/nginx/sites-available/, adjust the server name and paths,
# and link it from sites-enabled. The server itself listens on 127.0.0.1:8080; with Docker,
# publish it only there (`-p 127.0.0.1:8080:8080`) so nginx is the one way in.
#
# Certificates below are certbot's defaults:
#   certbot certonly --nginx -d vsesvit-service.mrquantumoff.dev

# Every request with a token the server has not seen in the last five minutes costs one call to
# the provider's userinfo endpoint, so bogus tokens are limited here, before they reach it.
limit_req_zone $binary_remote_addr zone=vsesvit_sync:10m rate=10r/s;
limit_req_status 429;

upstream vsesvit_sync {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name vsesvit-service.mrquantumoff.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vsesvit-service.mrquantumoff.dev;

    ssl_certificate /etc/letsencrypt/live/vsesvit-service.mrquantumoff.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vsesvit-service.mrquantumoff.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;

    # The server's MAX_REQUEST_BYTES (32 MiB by default). Keep the two equal.
    client_max_body_size 32m;
    # Slow clients are buffered here, not held open against the server.
    client_body_timeout 30s;
    client_header_timeout 15s;

    # Download pages are JSON with base64 bodies; they compress well.
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    # Tokens travel in the Authorization header, which nginx does not log by default. Keep it so.
    access_log /var/log/nginx/vsesvit-sync.access.log;

    location / {
        limit_req zone=vsesvit_sync burst=40 nodelay;

        proxy_pass http://vsesvit_sync;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An upload is one transaction; the first request of a token also waits on the provider
        # (the server gives up on it after 15 s).
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /healthz {
        proxy_pass http://vsesvit_sync;
        access_log off;
    }
}

# Behind Cloudflare, rate-limit the visitor rather than Cloudflare's edge: uncomment, and list
# Cloudflare's ranges from https://www.cloudflare.com/ips/ (one set_real_ip_from per range).
#
# real_ip_header CF-Connecting-IP;
# set_real_ip_from 173.245.48.0/20;
# set_real_ip_from 2400:cb00::/32;
