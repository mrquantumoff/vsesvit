# WX.0 extension spike: one workspace, a Linux (X11) and a Windows shell sharing `common/`.
# Not a member of the repo workspace.
[workspace]
resolver = "3"
members = ["linux", "win"]

[profile.dev]
opt-level = 1
debug = "line-tables-only"
[profile.dev.package."*"]
opt-level = 2
debug = false

# Vendored GPUI backends, each with one patch (see vendor/*.patch):
# X11: focus moving into an embedded child must not make the toplevel inactive.
# Windows: the message loop must not swallow WM_KEYDOWN for non-GPUI windows on its thread.
[patch.crates-io]
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
