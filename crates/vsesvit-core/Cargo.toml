[package]
name = "vsesvit-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Platform-agnostic core of the Vsesvit browser: profile store, sync-ready data model, omnibox, extension install pipeline"

[dependencies]
# One SQLite file per profile. `bundled` so both shells get the same SQLite (JSON functions, WAL) on every host;
# `functions` for the Unicode case folding history search needs (db::open).
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { version = "1.26", features = ["v4", "serde"] }
url = { workspace = true }
# Punycode hosts shown decoded in the address bar; already in the tree through `url`.
idna = "1.1"
thiserror = { workspace = true }
directories = "6"
# Extension pipeline. No protobuf crate: the CRX3 header needs ~60 lines of varint reading (extensions/crx.rs).
sha2 = "0.11"
rsa = "0.10.0-rc.18"
# The Chrome Web Store signs with an ECDSA P-256 publisher key next to the developer RSA key.
p256 = { version = "0.14", features = ["ecdsa"] }
base64 = "0.23"
zip = { version = "9.0.0-pre3", default-features = false, features = ["deflate"] }
ureq = "3.4"
# The Chrome Web Store answers extension update checks in XML (extensions/update.rs).
roxmltree = "0.21"
# The certificate details shown from the address bar lock.
x509-parser = "0.18"
# Favicons fetched for bookmarks are decoded and scaled to a 32x32 PNG. Only the formats sites serve icons in.
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg", "gif", "webp", "bmp"] }
# The profile vault (vault.rs): one OS-protected key per profile seals secrets such as sync tokens.
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
getrandom = "0.4"
log = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Pure Rust D-Bus and crypto, so the Secret Service adds no system library.
secret-service = { version = "5.2", features = ["rt-async-io-crypto-rust"] }

[features]
# Test helpers shared with the shells' self-tests: a CRX3 writer and a fixture HTTP server.
testkit = []

[dev-dependencies]
proptest = "1.11"
# Integration tests poke at the schema version directly (core_profile.rs).
rusqlite = { version = "0.40", features = ["bundled"] }
# So plain `cargo test` also runs the testkit-based extension tests.
vsesvit-core = { path = ".", features = ["testkit"] }
