[package]
name = "vsesvit-engine"
description = "The engine contract between Vsesvit's GPUI shell and its browser engine: types, the Engine trait, events, prompts, hooks, FakeEngine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# FakeEngine for other crates' tests (UA section 4.5). Adds types only.
fake = []
# `Engine::test_shutdown`, for the shutdown self-test checks (design section 3.6).
self-test = []

# Never gpui or cef (design section 1.1; `cargo xtask check-deps`).
[dependencies]
vsesvit-core = { workspace = true }
url = { workspace = true }
futures-channel = { workspace = true }
serde_json = { workspace = true }
