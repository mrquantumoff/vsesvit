[package]
name = "vsesvit-cef"
description = "Vsesvit's CEF glue: implements the vsesvit-engine contract over CEF"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Never gpui (design section 1.1; `cargo xtask check-deps`).
[dependencies]
cef = { workspace = true }
vsesvit-cef-child = { workspace = true }
vsesvit-engine = { workspace = true }
vsesvit-core = { workspace = true }
futures = { workspace = true }
url = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }
# Seeds Chromium's extension storage before its first start (design section 5.9).
rusty-leveldb = { workspace = true }
# DevTools results (screenshots, PDFs) arrive base64-encoded.
base64 = "0.22"

[features]
# `Engine::test_shutdown` for the shutdown self-test checks (design section 3.6).
self-test = ["vsesvit-engine/self-test"]

[target.'cfg(target_os = "linux")'.dependencies]
# poll(2) and eventfd(2) for the GLib fd watcher (`driver/glib.rs`).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Popup window styles and an Alloy browser's own DestroyWindow (`native.rs`).
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

# The smoke example hosts browsers in the shell's platform surface (design section 6.2).
[dev-dependencies]
vsesvit-gpui = { workspace = true, features = ["test-support"] }
vsesvit-testenv = { workspace = true }
# The smoke example opens the GPUI window the platform surface attaches to.
gpui = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
gpui_platform = { workspace = true, features = ["x11"] }

[target.'cfg(windows)'.dev-dependencies]
gpui_platform = { workspace = true }
# The smoke example counts the CEF sub-processes left after shutdown.
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"] }
