[package]
name = "vsesvit-update"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Vsesvit's self-updater: the client side of the Tauri updater protocol, blocking, for a worker thread"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
log = { workspace = true }
ureq = "3.4"
semver = "1"
minisign-verify = "0.2"
base64 = "0.23"
time = { version = "0.3", features = ["parsing"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
minisign = "0.10"
tempfile = "3"
