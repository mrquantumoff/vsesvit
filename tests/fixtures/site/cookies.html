<!doctype html>
<html>
<head><meta charset="utf-8"><title>Cookies</title></head>
<body style="font: 16px system-ui; margin: 32px">
  <h1>Cookies fixture</h1>
  <p>This page sets a cookie and embeds a frame from <code>localhost</code>, another site than 127.0.0.1,
  which sets one too. <code>cookieResults</code> holds the cookies each could read back, and the title
  turns to <code>cookies:ready</code> once the frame has answered.</p>
  <script>
    document.cookie = 'first=1; path=/';
    window.cookieResults = { page: document.cookie };
    addEventListener('message', e => {
      if (e.data?.cookieFrame === undefined) return;
      cookieResults.frame = e.data.cookieFrame;
      document.title = 'cookies:ready';
    });
    const frame = document.createElement('iframe');
    frame.src = 'http://localhost:' + location.port + '/cookie-frame.html';
    document.body.append(frame);
  </script>
</body>
</html>
