# Builds and tests every push and pull request (docs/design/linux-cef/design.md section 6.3).
# A step appears only once the unit that makes it pass has landed; no step runs a command that still
# answers "not available yet". Owners of this file, in order: W0.1, W0.5, W1.8, W6.6, W7.1.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    # GTK 4.22, libadwaita 1.9 and WebKitGTK 2.52 need Ubuntu 26.04, as in release.yml. Privileged
    # because Chromium's setuid sandbox, the self-test's fallback where the container has no user
    # namespaces, makes PID and network namespaces (CAP_SYS_ADMIN).
    container:
      image: ubuntu:26.04
      options: --privileged
    env:
      CEF_PATH: ${{ github.workspace }}/.cef
    steps:
      - name: Build dependencies
        run: |
          apt-get update
          # The GTK shell's build set (kept while vsesvit-gtk and vsesvit-webext are members), GPUI's
          # X11 build set, the libraries libcef loads, and the self-test's environment: Xvfb with
          # openbox (the launcher starts both), a session bus and a font.
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config curl ca-certificates git \
            libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev libglib2.0-bin libglib2.0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libfontconfig-dev \
            libnss3 libatk-bridge2.0-0t64 libcups2t64 libgbm1 libasound2t64 libgtk-3-0t64 mesa-vulkan-drivers \
            xvfb xauth openbox dbus fonts-dejavu-core
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # cef-dll-sys downloads CEF into CEF_PATH when it is missing.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cef
          key: cef-154.0.34-linux
      - run: cargo xtask vendor-gpui --check
      - run: cargo xtask check-deps
      # The input ban of clippy.toml fails the build; other lints stay warnings.
      - run: cargo clippy --workspace --all-features -- -D clippy::disallowed_methods
      - run: cargo test --workspace --exclude vsesvit-gtk --no-run
      # rust-cache restores deps/ but not the CEF runtime cef-dll-sys copies beside the bins on a fresh
      # build, so the tests load libcef from the CEF download itself.
      - run: LD_LIBRARY_PATH="$(echo "$CEF_PATH"/*/cef_linux_x86_64)" cargo test --workspace --exclude vsesvit-gtk
      # vsesvit-gtk's widget tests need a seat-bearing compositor, a session bus and user namespaces,
      # which this root container lacks; they run locally under a headless weston at each wave's end
      # (design log 2026-10-24). The crate is still built and linted above until wave 7 deletes it.
      - run: cargo xtask helper-check
      # Chromium refuses to run as root with its sandbox, so the self-test runs as a plain user, with
      # the setuid chrome-sandbox beside the browser (the packages' fallback, design section 3.5).
      - name: Self-test user
        run: |
          useradd --create-home tester
          cargo build -p vsesvit -p vsesvit-helper --no-default-features --features gpui
          chmod -R a+rwX "$GITHUB_WORKSPACE" "$HOME/.cargo" "$HOME/.rustup"
          # Outside the bind-mounted workspace, whose mount may drop the setuid bit; Chromium takes it
          # from CHROME_DEVEL_SANDBOX.
          install -o root -g root -m 4755 "$(echo "$CEF_PATH"/*/cef_linux_x86_64)/chrome-sandbox" /usr/local/sbin/chrome-devel-sandbox
      - name: Self-test
        run: |
          runuser -u tester -- env HOME=/home/tester CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup" \
            PATH="$HOME/.cargo/bin:$PATH" CEF_PATH="$CEF_PATH" CHROME_DEVEL_SANDBOX=/usr/local/sbin/chrome-devel-sandbox cargo xtask selftest --flavour gpui
      # The binary of an --all-features build of the workspace runs the same checks (design section 1.4).
      - name: Self-test, all features
        run: |
          runuser -u tester -- env HOME=/home/tester CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup" \
            PATH="$HOME/.cargo/bin:$PATH" CEF_PATH="$CEF_PATH" CHROME_DEVEL_SANDBOX=/usr/local/sbin/chrome-devel-sandbox cargo xtask selftest --flavour gpui --all-features

  windows-winui:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      CEF_PATH: ${{ github.workspace }}\.cef
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The CEF crates are workspace members, so they build here too: cef-dll-sys builds its
      # libcef_dll_wrapper with CMake and Ninja.
      - name: Ninja
        shell: pwsh
        run: if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja --no-progress -y }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cef
          key: cef-154.0.34-windows
      - run: cargo test --workspace --no-run
      # rust-cache restores deps/ but not the CEF runtime cef-dll-sys copies beside the bins on a fresh
      # build, so the tests load libcef from the CEF download itself.
      - run: PATH="$(echo "$(cygpath -u "$CEF_PATH")"/*/cef_windows_x86_64):$PATH" cargo test --workspace

  windows-gpui:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      CEF_PATH: ${{ github.workspace }}\.cef
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: gpui
      - name: Ninja
        shell: pwsh
        run: if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja --no-progress -y }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cef
          key: cef-154.0.34-windows
      - run: cargo build -p vsesvit --no-default-features --features gpui
      - run: cargo test -p vsesvit-engine -p vsesvit-cef -p vsesvit-gpui --no-run
      # rust-cache restores deps/ but not the CEF runtime cef-dll-sys copies beside the bins on a fresh
      # build, so the tests load libcef from the CEF download itself.
      - run: PATH="$(echo "$(cygpath -u "$CEF_PATH")"/*/cef_windows_x86_64):$PATH" cargo test -p vsesvit-engine -p vsesvit-cef -p vsesvit-gpui
      # On a private desktop of its own (design section 7.3).
      - run: cargo xtask selftest --flavour gpui
