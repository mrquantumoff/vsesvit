# Builds every package, signs the updater artifacts, creates the GitHub release and registers it
# with the update server (docs/design/packaging.md).
#
#   git tag v0.2.0 && git push --tags        stable; server rows wait for a release manager
#   git tag v0.2.0-beta.1 && git push --tags beta;   server rows wait for a release manager
#   schedule, or "Run workflow"              nightly / weekly; live on the server at once
#
# Secrets: TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD (the key whose public
# half is in packaging/updater.json) and VERSION_UPDATE_TRIGGER_TOKEN (update server API key).
# Actions are pinned to commits: the jobs hold the signing key, the update server's key and a
# token that can write to the repository.
name: Release

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 2 * * *" # nightly
    - cron: "0 3 * * 1" # weekly, Mondays
  workflow_dispatch:
    inputs:
      channel:
        description: Channel to build
        type: choice
        options: [nightly, weekly]
        default: nightly

permissions:
  contents: write
  actions: read # release-plan.sh reads the run's creation date

concurrency:
  group: release-${{ github.ref }}-${{ github.event.schedule || inputs.channel || 'tag' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  UPDATE_SERVER: https://api.usequadrant.dev/api/any/vsesvit

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      skip: ${{ steps.plan.outputs.skip }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: plan
        # An explicit bash runs with -o pipefail, so a failing plan fails the step despite the tee.
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          CHANNEL: ${{ github.event_name == 'schedule' && (github.event.schedule == '0 3 * * 1' && 'weekly' || 'nightly') || inputs.channel }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/release-plan.sh | tee -a "$GITHUB_OUTPUT"
      # GITHUB_TOKEN cannot hold the `workflows` permission, so GitHub refuses it a new tag on a
      # commit whose workflow files differ from main's. Tag now, while this run's commit is still
      # main's head: by the release job, a push that edits a workflow may have moved main on.
      - name: Tag
        if: steps.plan.outputs.skip != 'true' && github.event_name != 'push'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-run computes the same tag and finds it already here.
          # gh prints a 404's error body to stdout, so test its status, not its output.
          if ! tagged=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq .object.sha 2>/dev/null); then
            gh api "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" >/dev/null
          elif [[ "$tagged" != "$SHA" ]]; then
            echo "::error::$TAG already points at $tagged, not $SHA"; exit 1
          fi

  windows:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis --no-progress -y
          }
      - run: bash scripts/set-version.sh "${{ needs.plan.outputs.version }}"
      - run: cargo xtask package nsis
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-windows
          path: target/dist/*
          if-no-files-found: error

  linux:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # GTK 4.22, libadwaita 1.9 and WebKitGTK 2.52 need Ubuntu 26.04; the AppImage bundles its
    # libraries from this image's archive.
    container: ubuntu:26.04
    steps:
      - name: Build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config curl ca-certificates git \
            libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev libglib2.0-bin \
            dpkg-dev rpm libarchive-tools zstd fakeroot squashfs-tools \
            desktop-file-utils appstream
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: bash scripts/set-version.sh "${{ needs.plan.outputs.version }}"
      - run: cargo xtask package deb rpm pacman appimage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-linux
          path: target/dist/*
          if-no-files-found: error

  flatpak:
    needs: plan
    if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.channel != 'nightly'
    runs-on: ubuntu-latest
    steps:
      - name: Flatpak tooling
        run: |
          sudo apt-get update
          # With recommends: flatpak-builder strips binaries with elfutils' eu-strip on the host.
          sudo apt-get install -y flatpak flatpak-builder
          # flatpak-builder sandboxes each build step with bubblewrap in a user namespace.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: bash scripts/set-version.sh "${{ needs.plan.outputs.version }}"
      # Flatpak installs update through Flatpak, so the bundle is not signed or put in latest.json.
      - run: cargo xtask package flatpak
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-flatpak
          path: target/dist/*
          if-no-files-found: error

  # The xtask that signs, built apart from the packages, so no build script of theirs can touch it.
  signer:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      # No rust-cache: any job of the run can save a cache entry, so a cached registry or target
      # dir could carry code from the package builds into the binary that later runs with the key.
      # xtask compiles in the version, which each signature's trusted comment carries.
      - run: bash scripts/set-version.sh "${{ needs.plan.outputs.version }}"
      - run: cargo build --release --locked -p xtask
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signer
          path: target/release/xtask
          if-no-files-found: error

  # Only this job holds the signing key, and it runs no cargo, so no crate's build script or
  # proc-macro ever runs where it could read the key.
  sign:
    needs: [plan, windows, linux, signer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: signer
          path: signer
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: dist-windows
          path: target/dist
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: dist-linux
          path: target/dist
      - name: Sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          chmod +x signer/xtask
          signer/xtask sign target/dist/*-setup.exe target/dist/*.deb target/dist/*.rpm target/dist/*.pkg.tar.zst target/dist/*.AppImage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-signatures
          path: target/dist/*.sig
          if-no-files-found: error

  release:
    needs: [plan, windows, linux, flatpak, sign]
    # Nightlies omit Flatpak; all required builds must still succeed.
    if: >-
      always() && !cancelled() &&
      needs.plan.result == 'success' && needs.plan.outputs.skip != 'true' &&
      needs.windows.result == 'success' && needs.linux.result == 'success' && needs.sign.result == 'success' &&
      (needs.flatpak.result == 'success' ||
       (needs.plan.outputs.channel == 'nightly' && needs.flatpak.result == 'skipped'))
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      CHANNEL: ${{ needs.plan.outputs.channel }}
      TAG: ${{ needs.plan.outputs.tag }}
      PUBLISH: ${{ needs.plan.outputs.publish }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: bash scripts/set-version.sh "$VERSION"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: dist-*
          path: target/dist
          merge-multiple: true
      - name: Release notes
        run: |
          gh api "repos/$REPO/releases/generate-notes" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
            --jq .body > "$RUNNER_TEMP/notes.md"
      # Refuses artifacts whose signatures the updater.json key would reject.
      - run: cargo xtask manifest --base-url "https://github.com/$REPO/releases/download/$TAG" --notes "$RUNNER_TEMP/notes.md"
      - name: GitHub release
        run: |
          # The tag was pushed, or made by the plan job; creating it here could be refused.
          flags=(--title "Vsesvit $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag)
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); else flags+=(--latest); fi
          # A re-run finds the release its first attempt created and replaces the assets.
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || gh release create "$TAG" --repo "$REPO" "${flags[@]}"
          gh release upload "$TAG" --repo "$REPO" --clobber target/dist/*
      # After the release, so the URLs in latest.json resolve before any client is offered them.
      - name: Register with the update server
        env:
          TOKEN: ${{ secrets.VERSION_UPDATE_TRIGGER_TOKEN }}
        run: |
          curl --fail-with-body -sS -X PUT \
            -H "Authorization: $TOKEN" -H "Content-Type: application/json" \
            --data-binary @target/dist/latest.json \
            "$UPDATE_SERVER/add_updates/$CHANNEL/$VERSION?publish=$PUBLISH"
