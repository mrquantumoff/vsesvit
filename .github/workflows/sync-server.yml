# Tests the sync server on SQLite and Postgres, syncs real profiles through it, and publishes its
# image to ghcr.io/<owner>/vsesvit-sync-server: `latest` from main, `X.Y.Z` from a
# sync-server-vX.Y.Z tag. Actions are pinned to commits: the publish job holds a token that can
# push images.
name: Sync server

on:
  push:
    branches: [main]
    tags: ["sync-server-v*"]
    paths:
      - server/**
      - crates/vsesvit-sync-proto/**
      - crates/vsesvit-sync/**
      - .github/workflows/sync-server.yml
  pull_request:
    paths:
      - server/**
      - crates/vsesvit-sync-proto/**
      - crates/vsesvit-sync/**
      - .github/workflows/sync-server.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            server
            .
      - name: Server tests on SQLite and Postgres
        env:
          VSESVIT_SYNC_TEST_POSTGRES: postgres://postgres:test@localhost:5432/postgres
        run: cargo test --manifest-path server/Cargo.toml -- --test-threads=1
      - name: Profiles sync through the server
        run: bash scripts/sync-e2e.sh

  # Pull requests build the image with no permission to publish it.
  image:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: server/Dockerfile
          push: false
          cache-from: type=gha

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/vsesvit-sync-server
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=match,pattern=sync-server-v(.*),group=1
            type=sha
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
